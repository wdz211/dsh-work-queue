name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for f in $(find . -name '*.js' -o -name '*.mjs' | grep -v node_modules); do
            node --check "$f" || exit 1
          done
      - name: Unit tests
        run: node --test "test/*.test.mjs"
